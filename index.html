<title>Smash Up Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a tabletop. Scoreboard strip on top, a wrapping grid of base cards in the middle, the seated player's hand and inspector below, a prompt sheet pinned to the bottom edge. */
:root {
  --bg: #e9edf3; --surface: #ffffff; --surface-2: #f2f5f9; --ink: #121a2b; --muted: #57657a; --line: #cbd3df;
  --accent: #d6304a; --accent-ink: #ffffff; --hl: #f0b020; --good: #1f8a54; --bad: #c8342c;
  --shadow: 0 1px 0 rgba(18,26,43,.06), 0 6px 18px rgba(18,26,43,.07);
  --display: 'Alfa Slab One', 'Rockwell', 'Georgia', serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1420; --surface: #172033; --surface-2: #1d2840; --ink: #eef1f7; --muted: #9aa7bc; --line: #2b3852;
  --accent: #ff5a70; --accent-ink: #1a0b10; --hl: #f5c04a; --good: #4cc98a; --bad: #ff7a70;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1420; --surface: #172033; --surface-2: #1d2840; --ink: #eef1f7; --muted: #9aa7bc; --line: #2b3852;
  --accent: #ff5a70; --accent-ink: #1a0b10; --hl: #f5c04a; --good: #4cc98a; --bad: #ff7a70;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 18px 40px; }
.wrap.has-sheet { padding-bottom: 46vh; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { box-shadow: none; border-color: var(--line); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 99px; font-size: 12.5px; font-weight: 600; border: 1.5px solid var(--f, var(--line)); background: var(--surface); white-space: nowrap; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--f, var(--muted)); display: inline-block; }

/* setup */
.hero { padding: 26px 0 8px; }
.logo { font-family: var(--display); font-size: clamp(54px, 13vw, 118px); line-height: .9; letter-spacing: .5px; margin: 0; }
.logo span { display: inline-block; }
.logo .a { color: var(--ink); text-shadow: 4px 4px 0 var(--hl); }
.logo .b { color: var(--accent); transform: rotate(-3deg) translateY(4px); margin-left: .12em; text-shadow: 4px 4px 0 var(--ink); }
.tag { color: var(--muted); max-width: 52ch; margin: 14px 0 0; }
.setup-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); margin-top: 22px; }
.pcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; }
.pcard input[type=text] { width: 100%; font: inherit; font-weight: 700; font-size: 17px; background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.fgrid { display: flex; flex-wrap: wrap; gap: 7px; }
.fpick { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 10px 6px 8px; display: inline-flex; gap: 7px; align-items: center; font-weight: 600; font-size: 13.5px; }
.fpick i { width: 11px; height: 11px; border-radius: 3px; background: var(--f); }
.fpick[aria-pressed=true] { border-color: var(--f); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--f); }
.fpick[disabled] { opacity: .35; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 16px; font-weight: 700; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
details.rules { margin-top: 22px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; }
details.rules summary { cursor: pointer; font-weight: 700; }
details.rules ul { margin: 10px 0 2px; padding-left: 20px; color: var(--muted); }
details.rules li { margin: 4px 0; }

/* scoreboard */
.score { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.pl { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; min-width: 0; }
.pl.turn { border-color: var(--ink); box-shadow: 4px 4px 0 var(--hl), 0 0 0 1.5px var(--ink); }
.pl .nm { font-weight: 700; overflow-wrap: anywhere; }
.pl .vp { grid-row: span 2; font-family: var(--display); font-size: 34px; line-height: 1; text-align: right; }
.pl .vp small { font: 600 11px var(--body); display: block; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.pl .fs { display: flex; flex-wrap: wrap; gap: 4px; }
.pl .cnt { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 14px 0 12px; }
.phase { font-weight: 600; }
.phase b { font-family: var(--mono); }

/* bases */
.bases { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
.base { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 12px; display: grid; gap: 9px; align-content: start; box-shadow: var(--shadow); min-width: 0; }
.base.pick { outline: 4px solid var(--hl); outline-offset: 3px; cursor: pointer; }
.base.cancelled { opacity: .8; border-style: dashed; }
.base h3 { font-family: var(--display); font-size: 20px; font-weight: 400; line-height: 1.1; }
.base .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.vps { display: inline-flex; gap: 3px; font-family: var(--mono); font-weight: 700; font-size: 12.5px; }
.vps span { background: var(--ink); color: var(--bg); border-radius: 5px; padding: 1px 7px; }
.vps span:nth-child(2) { opacity: .75; } .vps span:nth-child(3) { opacity: .5; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; }
.meter.ready i { background: var(--good); }
.btxt { color: var(--muted); font-size: 12.5px; }
.pm { border-top: 1px dashed var(--line); padding-top: 7px; display: grid; gap: 5px; }
.pm .who { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.mins { display: flex; flex-wrap: wrap; gap: 6px; }
.mn { border: 1.5px solid var(--f); border-left-width: 6px; border-radius: 7px; background: var(--surface-2); padding: 3px 8px 3px 7px; display: inline-flex; flex-direction: column; text-align: left; min-width: 0; max-width: 100%; }
.mn .t { display: flex; gap: 7px; align-items: baseline; font-weight: 600; font-size: 13.5px; }
.mn .pw { font-family: var(--mono); font-weight: 700; }
.mn .pw.up { color: var(--good); } .mn .pw.down { color: var(--bad); }
.mn small { font-size: 11px; color: var(--muted); }
.mn.pick { outline: 3px solid var(--hl); outline-offset: 2px; }
.mn.dim { opacity: .5; }
.mn.sel { box-shadow: 0 0 0 3px var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 5px; }
.act { font-size: 12px; font-weight: 600; border: 1.5px solid var(--f, var(--line)); border-radius: 6px; padding: 1px 7px; background: var(--surface); }
.empty { color: var(--muted); font-size: 13px; }

/* hand & inspector */
.sect { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 8px; }
.sect h2 { font-family: var(--display); font-weight: 400; font-size: 22px; }
.hand { display: grid; gap: 9px; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); }
.card { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-top: 6px solid var(--f); border-radius: 9px; padding: 7px 9px 8px; display: grid; gap: 3px; min-width: 0; min-height: 82px; align-content: start; }
.card .nm { font-weight: 700; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.card .ty { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.card .ty b { font-family: var(--mono); font-size: 15px; color: var(--ink); letter-spacing: 0; }
.card.sel { border-color: var(--ink); box-shadow: 4px 4px 0 var(--hl), 0 0 0 1.5px var(--ink); }
.card.off { opacity: .55; }
.card.reveal { opacity: .5; cursor: default; }
.card.chosen { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.insp { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 13px; display: grid; gap: 7px; margin-bottom: 12px; }
.insp h3 { font-size: 17px; }
.insp p { margin: 0; max-width: 70ch; }
.insp .why { color: var(--muted); font-size: 13px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }

/* prompt sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 3px solid var(--ink);
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 30px rgba(0,0,0,.18); max-height: 52vh; overflow: auto; }
.sheet .in { max-width: 1180px; margin: 0 auto; display: grid; gap: 10px; }
.sheet .q { font-weight: 700; font-size: 16px; }
.sheet .q small { display: block; font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.sheet .cards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8,12,22,.78); display: grid; place-items: center; padding: 20px; }
.panel { background: var(--surface); border: 3px solid var(--ink); border-radius: 14px; padding: 22px; max-width: 520px; width: 100%; max-height: 86vh; overflow: auto; display: grid; gap: 14px; box-shadow: 8px 8px 0 var(--hl); }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.05; }
.panel.wide { max-width: 760px; }
.dlist { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.dlist li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 11px; font-weight: 600; }
.tabs button[aria-pressed=true] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.log { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13.5px; color: var(--muted); max-height: 260px; overflow: auto; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); }
.log li:first-child { color: var(--ink); font-weight: 600; }
.log li.turn { color: var(--ink); font-weight: 700; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
/* Smash Up (hot-seat) rules engine. Works in Node and in the browser.
   The engine is async: every choice goes through g.host.ask(). */
(function (root) {
'use strict';

/* ---------- static data ---------- */
const FACTIONS = {
  aliens:     { name: 'Aliens',     color: '#46b86a', blurb: 'Bounce minions back to hand, swap bases, gain VP.' },
  dinosaurs:  { name: 'Dinosaurs',  color: '#e49b2f', blurb: 'Huge power and sturdy defense.' },
  ninjas:     { name: 'Ninjas',     color: '#7788a6', blurb: 'Strike at the last second, destroy minions.' },
  pirates:    { name: 'Pirates',    color: '#d0583f', blurb: 'Move minions around, blast small ones.' },
  robots:     { name: 'Robots',     color: '#3f9bd6', blurb: 'Swarm the table with Microbots.' },
  tricksters: { name: 'Tricksters', color: '#e0569d', blurb: 'Set traps, punish and stall opponents.' },
  wizards:    { name: 'Wizards',    color: '#a066e8', blurb: 'Draw cards and play extra actions.' },
  zombies:    { name: 'Zombies',    color: '#98b040', blurb: 'Bring minions back from the discard pile.' }
};
const CARDS = {};
const BASES = {};
const ab = m => ({ player: m.controller, kind: 'ability' });
const ac = p => ({ player: p, kind: 'action' });
const rm = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); return i >= 0; };
const isMinionCard = c => c.def.type === 'minion' || c.def.type === 'fusion';

function M(f, id, name, power, count, text, h) { CARDS[id] = Object.assign({ id, faction: f, name, type: 'minion', power, count, text }, h || {}); }
function A(f, id, name, count, text, h) { CARDS[id] = Object.assign({ id, faction: f, name, type: 'action', count, text }, h || {}); }
function B(id, name, bp, vp, text) { BASES[id] = { id, name, bp, vp, text }; }

/* ---------- ALIENS ---------- */
M('aliens', 'overlord', 'Supreme Overlord', 5, 1, 'You may return a minion to its owner’s hand.', {
  onPlay: async (g, m) => { const t = await g.pickMinion(m.controller, g.allMinions(), 'Return a minion to its owner’s hand?', { optional: true, src: ab(m) }); if (t) await g.returnToHand(t, ab(m)); } });
M('aliens', 'invader', 'Invader', 3, 2, 'Gain 1 VP.', { onPlay: async (g, m) => g.addVP(m.controller, 1) });
M('aliens', 'scout', 'Scout', 3, 3, 'Special: after this base scores, you may return this minion to your hand.');
M('aliens', 'collector', 'Collector', 2, 4, 'You may return a minion of power 3 or less on this base to its owner’s hand.', {
  onPlay: async (g, m) => { const t = await g.pickMinion(m.controller, m.base.minions.filter(x => g.powerOf(x) <= 3), 'Return a minion of power 3 or less here?', { optional: true, src: ab(m) }); if (t) await g.returnToHand(t, ab(m)); } });
A('aliens', 'abduction', 'Abduction', 1, 'Return a minion to its owner’s hand. Play an extra minion.', {
  play: async (g, p) => { const t = await g.pickMinion(p, g.allMinions(), 'Return which minion to hand?', { src: ac(p) }); if (t) await g.returnToHand(t, ac(p)); await g.extraMinion(p, { optional: true }); } });
A('aliens', 'beamup', 'Beam Up', 2, 'Return a minion to its owner’s hand.', {
  play: async (g, p) => { const t = await g.pickMinion(p, g.allMinions(), 'Return which minion to hand?', { src: ac(p) }); if (t) await g.returnToHand(t, ac(p)); } });
A('aliens', 'crop', 'Crop Circles', 1, 'Choose a base. Return every minion there to its owner’s hand.', {
  play: async (g, p) => { const b = await g.pickBase(p, g.bases.filter(x => x.minions.length), 'Choose a base to clear'); if (b) for (const m of [...b.minions]) await g.returnToHand(m, ac(p)); } });
A('aliens', 'disintegrator', 'Disintegrator', 2, 'Put a minion of power 3 or less on the bottom of its owner’s deck.', {
  play: async (g, p) => { const t = await g.pickMinion(p, g.allMinions().filter(x => g.powerOf(x) <= 3), 'Send which minion to the bottom of its deck?', { src: ac(p) }); if (t) await g.toBottom(t, ac(p)); } });
A('aliens', 'invasion', 'Invasion', 1, 'Move a minion to another base.', {
  play: async (g, p) => { const t = await g.pickMinion(p, g.allMinions().filter(x => g.bases.some(b => g.canMoveTo(x, b, ac(p)))), 'Move which minion?', { src: ac(p) }); if (!t) return;
    const d = await g.pickBase(p, g.bases.filter(b => g.canMoveTo(t, b, ac(p))), 'Move it to which base?'); if (d) await g.move(t, d, ac(p)); } });
A('aliens', 'jammed', 'Jammed Signal', 1, 'Play on a base. Its abilities are cancelled.', { target: 'base' });
A('aliens', 'probe', 'Probe', 1, 'Look at another player’s hand and make them discard a minion from it.', {
  play: async (g, p) => { const os = g.others(p).filter(i => g.players[i].hand.length); if (!os.length) return;
    let t = os[0]; if (os.length > 1) t = +(await g.pickOption(p, os.map(i => ({ id: String(i), label: g.players[i].name })), 'Probe whose hand?'));
    const hand = g.players[t].hand; const ms = hand.filter(isMinionCard);
    const c = await g.pickCards(p, ms.length ? ms : hand, ms.length ? `Probe: choose a minion for ${g.players[t].name} to discard` : `${g.players[t].name} has no minions`, { reveal: hand, optional: !ms.length });
    if (c) { rm(hand, c); g.players[c.owner].discard.push(c); g.log(`${g.players[t].name} discards ${c.def.name}.`); } } });
A('aliens', 'terraforming', 'Terraforming', 1, 'Swap a base in play with one from the base deck. You may play an extra minion there.', {
  play: async (g, p) => { if (!g.baseDeck.length) return;
    const b = await g.pickBase(p, g.bases, 'Swap which base?'); if (!b) return;
    const id = await g.pickOption(p, g.baseDeck.map((d, i) => ({ id: String(i), label: `${d.name} (breakpoint ${d.bp}, ${d.vp.join('/')})` })), 'Choose a base from the deck');
    const i = +id; const nd = g.baseDeck.splice(i, 1)[0]; g.baseDeck.push(b.def); g.shuffle(g.baseDeck); b.def = nd; b.breakMods = [];
    g.log(`Terraforming: ${nd.name} takes the place of the old base.`);
    await g.extraMinion(p, { base: b, optional: true }); } });
B('homeworld', 'The Homeworld', 23, [4, 2, 1], 'Once per turn, after you play a minion here, you may play an extra minion of power 2 or less.');
B('mothership', 'The Mothership', 20, [4, 2, 1], 'After this base scores, the winner may return one of their minions of power 3 or less from here to their hand.');

/* ---------- DINOSAURS ---------- */
M('dinosaurs', 'kingrex', 'King Rex', 7, 1, 'No ability. Just big.');
M('dinosaurs', 'laseratops', 'Laseratops', 4, 2, 'You may destroy a minion here with printed power 2 or less.', {
  onPlay: async (g, m) => { const t = await g.pickMinion(m.controller, m.base.minions.filter(x => x.def.power <= 2), 'Destroy a minion of printed power 2 or less?', { optional: true, src: ab(m) }); if (t) await g.destroy(t, ab(m)); } });
M('dinosaurs', 'stego', 'Armor Stego', 3, 3, 'Talent: until the start of your turn, +2 power during other players’ turns.', {
  talent: { can: () => true, run: async (g, m) => { m.stego = true; g.log('Armor Stego braces itself.'); } } });
M('dinosaurs', 'raptor', 'War Raptor', 2, 4, 'Gains +1 power for each War Raptor on this base (including itself).', {
  mod: (g, m) => m.base ? m.base.minions.filter(x => x.def.id === 'raptor').length : 0 });
A('dinosaurs', 'augmentation', 'Augmentation', 2, 'One minion gets +4 power until the end of your turn.', {
  play: async (g, p) => { const t = await g.pickMinion(p, g.allMinions(), 'Give +4 power to which minion?', { src: ac(p) }); if (t) { t.temp.push({ amt: 4, until: 'end' }); g.log(`${t.def.name} gets +4 power.`); } } });
A('dinosaurs', 'howl', 'Howl', 2, 'Each of your minions gets +1 power until the end of your turn.', {
  play: async (g, p) => { for (const m of g.minionsOf(p)) m.temp.push({ amt: 1, until: 'end' }); g.log('Howl: your minions get +1 power.'); } });
A('dinosaurs', 'natsel', 'Natural Selection', 1, 'Choose one of your minions. Destroy a minion on its base with less power.', {
  play: async (g, p) => { const mine = g.minionsOf(p).filter(m => m.base.minions.some(x => g.powerOf(x) < g.powerOf(m)));
    const m = await g.pickMinion(p, mine, 'Choose your minion', {}); if (!m) return;
    const t = await g.pickMinion(p, m.base.minions.filter(x => g.powerOf(x) < g.powerOf(m)), 'Destroy which minion?', { src: ac(p) }); if (t) await g.destroy(t, ac(p)); } });
A('dinosaurs', 'rampage', 'Rampage', 1, 'Reduce a base’s breakpoint by the power of one of your minions there until end of turn.', {
  play: async (g, p) => { const bs = g.bases.filter(b => b.minions.some(m => m.controller === p)); const b = await g.pickBase(p, bs, 'Choose a base'); if (!b) return;

  const s = ui.setup; const used = new Set(); for (let i = 0; i < s.n; i++) s.players[i].f.forEach(f => used.add(f));
  const ready = s.players.slice(0, s.n).every(p => p.f.length === 2 && p.name.trim());
  let h = `<header class="hero"><h1 class="logo"><span class="a">SMASH</span><span class="b">UP</span></h1>
    <p class="tag">Pick two factions each, shuffle them into one 40-card deck, and fight over the bases. Pass this one screen around the table; hands stay hidden between turns.</p></header>
    <div class="row" style="margin-top:18px"><span class="label">Players</span><div class="seg" role="group" aria-label="Number of players">${[2, 3, 4].map(n => `<button data-act="n" data-n="${n}" aria-pressed="${s.n === n}">${n}</button>`).join('')}</div>
    <button class="btn ghost" data-act="rand">Deal random factions</button></div>
    <div class="setup-grid">`;
  for (let i = 0; i < s.n; i++) { const p = s.players[i];
    h += `<section class="pcard"><input type="text" id="pn${i}" value="${esc(p.name)}" maxlength="18" aria-label="Player ${i + 1} name" data-pn="${i}">
      <div class="label">Choose 2 factions (${p.f.length}/2)</div><div class="fgrid">${fkeys.map(f => { const on = p.f.includes(f); const dis = !on && (used.has(f) || p.f.length >= 2);
        return `<button class="fpick" style="--f:${fcol(f)}" data-act="pf" data-i="${i}" data-f="${f}" aria-pressed="${on}" ${dis ? 'disabled' : ''}><i></i>${FACTIONS[f].name}</button>`; }).join('')}</div>
      <div class="btxt">${p.f.map(f => FACTIONS[f].blurb).join(' ')}</div></section>`; }
  h += `</div><div class="row" style="margin-top:22px"><button class="btn primary" data-act="start" ${ready ? '' : 'disabled'}>Deal the cards</button>${ready ? '' : '<span class="btxt">Each player needs a name and two different factions.</span>'}</div>
    <details class="rules"><summary>Rules at a glance</summary><ul>
      <li>On your turn play one minion and one action (in any order), use talents, then bases that reached their breakpoint score, you draw 2 cards, and the turn passes left.</li>
      <li>Bases score only at the end of your turn. Top three in power earn the VP shown (for example 4/2/1). Ties share the higher place.</li>
      <li>First to 15 VP at the end of a turn wins. A tie at the top keeps the game going.</li>
      <li>Included: the eight original factions and their 16 bases. Titans and expansion decks are not in this version.</li>
      <li>Tooth and Claw can only be played on your own minions here, a small simplification.</li></ul></details>`;
  return h; }

function renderBoard() {
  const g = ui.g, pr = ui.prompt, spec = pr && pr.spec;
  const candM = spec && spec.kind === 'minion' ? new Set(spec.cands.map(m => m.uid)) : null;
  const candB = spec && spec.kind === 'base' ? new Set(spec.cands.map(b => b.uid)) : null;
  let h = '<div class="bases">';
  for (const b of g.bases) {
    const pw = g.basePower(b), bp = g.breakpoint(b), ready = pw >= bp, active = g.baseActive(b);
    const byP = g.order(g.current).filter(i => b.minions.some(m => m.controller === i));
    h += `<article class="base ${candB && candB.has(b.uid) ? 'pick' : ''} ${active ? '' : 'cancelled'}" ${candB && candB.has(b.uid) ? `data-act="pickbase" data-uid="${b.uid}" role="button" tabindex="0"` : `data-act="inspectbase" data-uid="${b.uid}"`}>
      <h3>${esc(b.def.name)}</h3>
      <div class="meta"><span class="mono"><b>${pw}</b> / ${bp}</span><span class="vps">${b.def.vp.map(v => `<span>${v}</span>`).join('')}</span>${active ? '' : '<span class="chip">abilities off</span>'}${ready ? '<span class="chip" style="--f:var(--good)">ready to score</span>' : ''}</div>
      <div class="meter ${ready ? 'ready' : ''}"><i style="width:${Math.min(100, Math.round(pw / bp * 100))}%"></i></div>
      <div class="btxt">${esc(b.def.text)}</div>`;
    if (b.actions.length) h += `<div class="acts">${b.actions.map(a => `<button class="act" style="--f:${fcol(a.def.faction)}" data-act="inspect" data-uid="${a.uid}">${esc(a.def.name)} <small>${pname(a.controller)}</small></button>`).join('')}</div>`;
    if (!b.minions.length) h += '<div class="empty">No minions yet.</div>';
    for (const i of byP) { const ms = b.minions.filter(m => m.controller === i); const tot = ms.reduce((s, m) => s + g.powerOf(m), 0);
      h += `<div class="pm"><div class="who"><span>${pname(i)}</span><span class="mono">${tot}</span></div><div class="mins">${ms.map(m => {
        const pw2 = g.powerOf(m), cls = ['mn']; if (candM) cls.push(candM.has(m.uid) ? 'pick' : 'dim'); if (pr && pr.sel.has(m.uid)) cls.push('sel');
        const tags = [...m.attached.map(a => a.def.name), ...(m.counters ? [`+${m.counters} counter${m.counters > 1 ? 's' : ''}`] : []), ...(m.stego ? ['braced'] : [])];
        return `<button class="${cls.join(' ')}" style="--f:${fcol(m.def.faction)}" data-act="${candM && candM.has(m.uid) ? 'pickminion' : 'inspect'}" data-uid="${m.uid}" title="${esc(m.def.text)}"><span class="t"><span>${esc(m.def.name)}</span><span class="pw ${pw2 > m.def.power ? 'up' : pw2 < m.def.power ? 'down' : ''}">${pw2}</span></span>${tags.length ? `<small>${esc(tags.join(' · '))}</small>` : ''}</button>`; }).join('')}</div></div>`; }
    h += '</article>'; }
  return h + '</div>'; }

function renderGame() {
  const g = ui.g, t = g.turn; const seat = ui.seat; const myTurn = ui.turn && ui.turn.p === seat && !ui.cover;
  let h = `<div class="score">${g.players.map(pl => `<div class="pl ${g.current === pl.idx ? 'turn' : ''}"><span class="nm">${esc(pl.name)}</span><span class="vp">${pl.vp}<small>VP</small></span>
    <span class="fs">${pl.factions.map(chip).join('')}</span><span class="cnt"><span>Hand ${pl.hand.length}</span><span>Deck ${pl.deck.length}</span><span>Discard ${pl.discard.length}</span></span></div>`).join('')}</div>
    <div class="bar"><div class="phase">${g.over ? 'Game over' : `${pname(g.current)}’s turn · minion <b>${t.minionsLeft}</b> · action <b>${t.actionsLeft}</b> left`}</div>
      <div class="row"><button class="btn ghost" data-act="discards">Discard piles</button><button class="btn ghost" data-act="log">${ui.showLog ? 'Hide log' : 'Show log'}</button><button class="btn ghost" data-act="quit">New game</button></div></div>`;
  h += renderBoard();
  if (ui.showLog) h += `<div class="sect"><h2>Table log</h2></div><ul class="log">${g.logs.slice(-60).reverse().map(l => `<li class="${l.startsWith('—') ? 'turn' : ''}">${esc(l)}</li>`).join('')}</ul>`;
  if (seat != null && !ui.cover && !g.over) {
    const pl = g.players[seat]; const mode = ui.turn && ui.turn.p === seat;
    h += `<div class="sect"><h2>${esc(pl.name)}’s hand</h2><span class="btxt">${pl.hand.length} card${pl.hand.length === 1 ? '' : 's'}</span></div>`;
    h += renderInspector(mode);
    if (mode && ui.turn.info.options.length) h += `<div class="label" style="margin-bottom:6px">Talents and special plays</div><div class="opts" style="margin-bottom:12px">${ui.turn.info.options.map(o => `<button class="btn" data-act="opt" data-id="${o.id}">${esc(o.label)}</button>`).join('')}</div>`;
    h += `<div class="hand">${pl.hand.length ? pl.hand.map(c => cardTile(c, { act: 'hcard', sel: ui.selCard === c.uid, off: mode && !g.playableModes(seat, c).length })).join('') : '<div class="empty">Your hand is empty.</div>'}</div>`;
    if (mode) h += `<div class="row" style="margin-top:16px"><button class="btn primary" data-act="end">Done playing: score bases and draw</button></div>`; }
  return h; }

function renderInspector(mode) {
  const g = ui.g; let h = '';
  if (ui.selCard) { const c = find(ui.selCard); if (c) { const d = c.def, modes = mode ? g.playableModes(ui.seat, c) : [];
    h = `<div class="insp"><div class="row">${chip(d.faction)}<h3>${esc(d.name)}</h3><span class="mono">${d.type === 'fusion' ? 'minion 2 / action' : d.type === 'minion' ? 'minion ' + d.power : 'action'}</span></div><p>${esc(d.text)}</p>
      ${mode ? `<div class="opts">${modes.includes('minion') ? '<button class="btn primary" data-act="play" data-m="minion">Play as minion</button>' : ''}${modes.includes('action') ? '<button class="btn primary" data-act="play" data-m="action">Play as action</button>' : ''}</div>${modes.length ? '' : `<div class="why">${why(c)}</div>`}` : ''}</div>`; } }
  else if (ui.inspect) { const o = find(ui.inspect); if (o) h = inspectBox(o); }
  else h = `<div class="insp"><div class="why">${mode ? 'Tap a card in your hand to read it and play it. Tap anything on the table to read its text.' : 'Tap a card to read it.'}</div></div>`;
  return h; }
function why(c) { const g = ui.g, d = c.def, t = g.turn; const isM = d.type === 'minion' || d.type === 'fusion', isA = d.type === 'action' || d.type === 'fusion';
  if (d.specialOnly) return 'This is a Special: you can only play it just before a base scores.';
  if (isM && !isA && t.minionsLeft <= 0) return 'You have already played your minion this turn.';
  if (isA && !isM && t.actionsLeft <= 0) return 'You have already played your action this turn.';
  if (isA && g.sleep[ui.seat] && g.sleep[ui.seat].noActions) return 'Mark of Sleep: you cannot play actions until the caster’s next turn.';
  return 'No legal play for this card right now.'; }
function inspectBox(o) {
  const g = ui.g;
  if (o.minions) return `<div class="insp"><h3>${esc(o.def.name)}</h3><p>${esc(o.def.text)}</p></div>`;
  const d = o.def; let extra = '';
  if (o.base !== undefined && o.controller !== undefined) extra = `<div class="why">Controlled by ${pname(o.controller)} · power now ${g.powerOf(o)} (printed ${d.power})${o.counters ? ` · ${o.counters} counter(s)` : ''}</div>`;
  else if (o.controller !== undefined) extra = `<div class="why">Played by ${pname(o.controller)}</div>`;
  return `<div class="insp"><div class="row">${chip(d.faction)}<h3>${esc(d.name)}</h3></div><p>${esc(d.text)}</p>${extra}</div>`; }

function renderSheet() {
  const pr = ui.prompt; if (!pr || ui.cover) return ''; const s = pr.spec, g = ui.g;
  let body = '';
  const who = `<small>${pname(pr.p)}</small>`;
  if (s.kind === 'minion') body = `<div class="q">${who}${esc(s.prompt)} <span class="btxt">Tap a highlighted minion.</span></div><div class="opts">${s.optional ? '<button class="btn" data-act="skip">Skip</button>' : ''}${s.cancel ? '<button class="btn" data-act="skip">Cancel</button>' : ''}</div>`;
  else if (s.kind === 'base') body = `<div class="q">${who}${esc(s.prompt)} <span class="btxt">Tap a highlighted base.</span></div><div class="opts">${s.optional ? '<button class="btn" data-act="skip">Skip</button>' : ''}${s.cancel ? '<button class="btn" data-act="skip">Cancel</button>' : ''}</div>`;
  else if (s.kind === 'yesno') body = `<div class="q">${who}${esc(s.prompt)}</div>${s.reveal ? `<div class="cards">${s.reveal.map(c => cardTile(c, { reveal: true })).join('')}</div>` : ''}<div class="opts"><button class="btn primary" data-act="yes">Yes</button><button class="btn" data-act="no">No</button></div>`;
  else if (s.kind === 'options') body = `<div class="q">${who}${esc(s.prompt)}</div>${s.reveal ? `<div class="cards">${s.reveal.map(c => cardTile(c, { reveal: true })).join('')}</div>` : ''}<div class="opts">${s.options.map(o => `<button class="btn ${o.id === '__pass' ? 'ghost' : ''}" data-act="option" data-id="${esc(o.id)}">${esc(o.label)}</button>`).join('')}${s.optional ? '<button class="btn ghost" data-act="skip">Skip</button>' : ''}</div>`;
  else if (s.kind === 'cards') {
    const ids = new Set(s.cands.map(c => c.uid)); const rest = (s.reveal || []).filter(c => !ids.has(c.uid));
    body = `<div class="q">${who}${esc(s.prompt)}</div>${rest.length ? `<div class="label">Also revealed</div><div class="cards">${rest.map(c => cardTile(c, { reveal: true })).join('')}</div><div class="label">Choose from</div>` : ''}
      <div class="cards">${s.cands.map(c => cardTile(c, { act: 'pickcard', chosen: pr.sel.has(c.uid) })).join('')}</div>
      <div class="opts">${s.multi ? `<button class="btn primary" data-act="confirm">Confirm (${pr.sel.size})</button>` : ''}${s.optional ? '<button class="btn" data-act="skip">Skip</button>' : ''}${s.cancel ? '<button class="btn" data-act="skip">Cancel</button>' : ''}</div>`; }
  return `<div class="sheet" role="dialog" aria-live="polite"><div class="in">${body}</div></div>`; }

function renderLayer() {
  let h = '';
  if (ui.screen === 'game') { const g = ui.g;
    if (ui.cover != null) h += `<div class="overlay"><div class="panel"><div class="label">Pass the device</div><h2>${pname(ui.cover)}, you’re up</h2><p class="btxt" style="margin:0">Everyone else look away. Your hand is shown once you tap the button.</p><button class="btn primary" data-act="seat" data-p="${ui.cover}">I’m ${pname(ui.cover)}</button></div></div>`;
    else if (g.over) h += `<div class="overlay"><div class="panel"><div class="label">Final scores</div><h2>${pname(g.winner)} wins</h2><ul class="dlist">${g.players.slice().sort((a, b) => b.vp - a.vp).map(p => `<li><span>${esc(p.name)}</span><b class="mono">${p.vp} VP</b></li>`).join('')}</ul><div class="row"><button class="btn primary" data-act="quit">Play again</button></div></div></div>`;
    else if (ui.modal === 'discards') { const k = ui.dtab != null ? ui.dtab : 0; const pl = g.players[k];
      const groups = {}; pl.discard.forEach(c => { groups[c.def.name] = (groups[c.def.name] || 0) + 1; });
      h += `<div class="overlay" data-act="closemodal"><div class="panel wide" data-stop="1"><h2>Discard piles</h2><div class="tabs">${g.players.map(p => `<button data-act="dtab" data-i="${p.idx}" aria-pressed="${p.idx === k}">${esc(p.name)} (${p.discard.length})</button>`).join('')}</div>
        <ul class="dlist">${Object.keys(groups).length ? Object.keys(groups).sort().map(n => `<li><span>${esc(n)}</span><b class="mono">×${groups[n]}</b></li>`).join('') : '<li class="empty">Empty.</li>'}</ul><button class="btn" data-act="closemodal">Close</button></div></div>`; }
    h += renderSheet(); }
  return h; }

function render() {
  const keep = { x: window.scrollX, y: window.scrollY };
  if (ui.screen === 'setup') { $app.className = 'wrap'; $app.innerHTML = renderSetup(); $layer.innerHTML = ''; }
  else { $app.className = 'wrap' + (ui.prompt && !ui.cover ? ' has-sheet' : ''); $app.innerHTML = renderGame(); $layer.innerHTML = renderLayer(); }
  window.scrollTo(keep.x, keep.y); }

/* ---------- events ---------- */
document.addEventListener('input', e => { const i = e.target.getAttribute && e.target.getAttribute('data-pn'); if (i != null) { ui.setup.players[+i].name = e.target.value; saveSetup(); const b = document.querySelector('[data-act=start]'); if (b) b.disabled = !ui.setup.players.slice(0, ui.setup.n).every(p => p.f.length === 2 && p.name.trim()); } });
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act; const g = ui.g;
  if (a === 'noop') return;
  if (a === 'n') { ui.setup.n = +el.dataset.n; for (let i = ui.setup.n; i < 4; i++) ui.setup.players[i].f = ui.setup.players[i].f; saveSetup(); render(); return; }
  if (a === 'pf') { const p = ui.setup.players[+el.dataset.i], f = el.dataset.f; const k = p.f.indexOf(f); if (k >= 0) p.f.splice(k, 1); else if (p.f.length < 2) p.f.push(f); saveSetup(); render(); return; }
  if (a === 'rand') { const f = fkeys.slice().sort(() => Math.random() - .5); ui.setup.players.forEach((p, i) => { p.f = i < ui.setup.n ? [f[i * 2], f[i * 2 + 1]] : []; }); saveSetup(); render(); return; }
  if (a === 'start') { startGame(); return; }
  if (a === 'quit') { ui.screen = 'setup'; ui.g = null; ui.prompt = null; ui.turn = null; ui.cover = null; ui.seat = null; ui.modal = null; render(); return; }
  if (a === 'seat') { ui.seat = +el.dataset.p; ui.cover = null; render(); return; }
  if (a === 'discards') { ui.modal = 'discards'; ui.dtab = 0; render(); return; }
  if (a === 'dtab') { ui.dtab = +el.dataset.i; render(); return; }
  if (a === 'closemodal') { ui.modal = null; render(); return; }
  if (a === 'log') { ui.showLog = !ui.showLog; render(); return; }
  if (a === 'hcard') { const uid = +el.dataset.uid; ui.selCard = ui.selCard === uid ? null : uid; ui.inspect = null; render(); return; }
  if (a === 'inspect' || a === 'inspectbase') { if (ui.prompt) return; ui.inspect = +el.dataset.uid; ui.selCard = null; render(); return; }
  if (a === 'end' && ui.turn) { act({ type: 'end' }); return; }
  if (a === 'opt' && ui.turn) { act({ type: 'opt', id: el.dataset.id }); return; }
  if (a === 'play' && ui.turn && ui.selCard) { const c = find(ui.selCard); if (c) { const m = el.dataset.m; g.__forceMode = m; act({ type: 'play', card: c, mode: m }); } return; }
  if (!ui.prompt) return;
  const pr = ui.prompt;
  if (a === 'pickminion' || a === 'pickbase') { answer(find(+el.dataset.uid)); return; }
  if (a === 'pickcard') { const c = find(+el.dataset.uid); if (pr.spec.multi) { if (pr.sel.has(c.uid)) pr.sel.delete(c.uid); else pr.sel.add(c.uid); render(); } else answer(c); return; }
  if (a === 'confirm') { answer(pr.spec.cands.filter(c => pr.sel.has(c.uid))); return; }
  if (a === 'skip') { answer(pr.spec.multi ? [] : null); return; }
  if (a === 'yes') { answer(true); return; }
  if (a === 'no') { answer(false); return; }
  if (a === 'option') { answer(el.dataset.id); return; }
});

/* ---------- game start ---------- */
function startGame() {
  const s = ui.setup; const players = s.players.slice(0, s.n).map(p => ({ name: p.name.trim() || 'Player', factions: p.f.slice() }));
  ui.g = SU.createGame({ players, host }); ui.screen = 'game'; ui.seat = null; ui.cover = null; ui.prompt = null; ui.turn = null; ui.modal = null;
  // let the engine honour the chosen play mode for fusion cards
  const g = ui.g; const orig = g.pickOption;
  g.pickOption = async function (p, options, prompt, o) { if (g.__forceMode && options.length === 2 && options[0].id === 'minion' && options[1].id === 'action') { const m = g.__forceMode; g.__forceMode = null; return m; } return orig(p, options, prompt, o); };
  const origPlay = g.playCardFromHand; g.playCardFromHand = async (p, c) => { try { return await origPlay(p, c); } finally { g.__forceMode = null; } };
  g.run().then(() => { render(); }).catch(err => { console.error(err); $app.insertAdjacentHTML('afterbegin', `<div class="insp"><b>Something went wrong:</b> ${esc(err && err.message || err)}. Start a new game to continue.</div>`); });
  render(); }
render();
})();
</script>
